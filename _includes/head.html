<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
  <style>
    /* Check and cross marks: green for good, red for bad. Both pass WCAG AA on white and on code blocks. */
    .mark-ok { color: #1f7a4d; font-weight: 700; }
    .mark-no { color: #b42318; font-weight: 700; }
  </style>
  <script>
    // Color every ✓ green and every ✗ red, including inside code blocks, without changing the text.
    document.addEventListener("DOMContentLoaded", function () {
      var root = document.querySelector(".page-content") || document.body;
      var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode: function (n) { return /[✓✗]/.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT; }
      });
      var nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach(function (node) {
        var frag = document.createDocumentFragment();
        node.nodeValue.split(/([✓✗])/).forEach(function (part) {
          if (part === "✓" || part === "✗") {
            var s = document.createElement("span");
            s.className = part === "✓" ? "mark-ok" : "mark-no";
            s.textContent = part;
            frag.appendChild(s);
          } else if (part) {
            frag.appendChild(document.createTextNode(part));
          }
        });
        node.parentNode.replaceChild(frag, node);
      });
    });
  </script>
  <script>
    // Section tabs: on pages with <div data-section-tabs></div>, turn the page's section headings into a
    // sticky row of tabs. The tab for the section on screen is highlighted as you scroll.
    document.addEventListener("DOMContentLoaded", function () {
      var slot = document.querySelector("[data-section-tabs]");
      if (!slot) return;
      var skip = /^(related resources)$/i;
      var heads = Array.prototype.slice.call(document.querySelectorAll(".page-content h2[id]")).filter(function (h) { return !skip.test(h.textContent.trim()); });
      if (heads.length < 3) return;
      var nav = document.createElement("nav");
      nav.className = "page-tabs";
      nav.setAttribute("aria-label", "Sections on this page");
      var ul = document.createElement("ul");
      var links = heads.map(function (h) {
        var text = h.textContent.trim();
        var m = text.match(/^Step (\d+):\s*(.*)$/i);
        var label = m ? m[1] + ". " + m[2] : text;
        if (label.length > 40) label = label.slice(0, 38).replace(/\s+\S*$/, "") + "…";
        var li = document.createElement("li");
        var a = document.createElement("a");
        a.href = "#" + h.id;
        a.textContent = label;
        a.title = text;
        a.style.setProperty("--brand", "#2347e8");
        li.appendChild(a);
        ul.appendChild(li);
        return a;
      });
      nav.appendChild(ul);
      slot.replaceWith(nav);
      var current = -1, ticking = false;
      function update() {
        ticking = false;
        var idx = 0;
        for (var i = 0; i < heads.length; i++) { if (heads[i].getBoundingClientRect().top <= 120) idx = i; else break; }
        if (idx === current) return;
        current = idx;
        links.forEach(function (a, i) {
          a.classList.toggle("is-active", i === idx);
          if (i === idx) a.setAttribute("aria-current", "true"); else a.removeAttribute("aria-current");
        });
        var a = links[idx];
        nav.scrollTo({ left: a.offsetLeft - nav.clientWidth / 2 + a.clientWidth / 2, behavior: "smooth" });
      }
      window.addEventListener("scroll", function () { if (!ticking) { ticking = true; requestAnimationFrame(update); } }, { passive: true });
      update();
    });
  </script>
</head>

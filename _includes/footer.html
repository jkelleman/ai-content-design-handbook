<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>
  <div class="wrapper">
    <h2 class="footer-heading">{{ site.title | escape }}</h2>
    <div class="footer-col-wrapper">
      <div class="footer-col footer-col-1">
        <ul class="contact-list">
          <li class="p-name">Written by {{ site.author | escape }}</li>
          <li><a href="https://aiwithjen.com">aiwithjen.com</a>: portfolio and case studies</li>
        </ul>
      </div>
      <div class="footer-col footer-col-2">
        {%- include social.html -%}
      </div>
      <div class="footer-col footer-col-3">
        <p>{{- site.description | escape -}}</p>
        <p class="footer-note">Examples use a fictional product, DataFlow. Numbers in sample dashboards and test results are illustrative.</p>
      </div>
    </div>
  </div>
</footer>

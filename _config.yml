title: AI Content Design Handbook
description: Templates, workflows, and ethical guidelines for designing the words in AI products, with examples from how leading tech companies design their own content.
theme: minima
author: Jen Kelleman
show_excerpts: true
baseurl: "/ai-content-design-handbook"
url: "https://jkelleman.github.io"

minima:
  skin: auto
  social_links:
    github: https://github.com/jkelleman/ai-content-design-handbook

# A short top navigation: the three guides to read first, and the industry reference.
header_pages:
  - templates/ai-content/agentic-experiences.md
  - workflows/testing/llm-as-a-judge.md
  - templates/messages/error-messages.md
  - resources/industry-examples.md

# Repo housekeeping stays on GitHub and out of the published site.
exclude:
  - README.md
  - CONTRIBUTING.md
  - STRUCTURE.md
  - assets/banner.html

# Use each page's first heading as its title once, in the layout, instead of twice.
titles_from_headings:
  strip_title: true
